# GitHub Actions CI/CD Pipeline
# Triggers: push to main, pull requests to main
# Jobs: build, test, docker build

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_VERSION: '3.9.9'
  JAVA_VERSION: '17'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw
      
      - name: Build with Maven
        run: ./mvnw clean compile -B
      
      - name: Run tests
        run: ./mvnw test -B
      
      - name: Package application
        run: ./mvnw package -DskipTests -B
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-jwt-api
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: task-manager-jwt-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image starts (smoke test with real MySQL)
        run: |
          docker network create task-test-net
          docker run -d --name test-mysql --network task-test-net \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=taskdb \
            mysql:8.0
          echo "Waiting for MySQL to be ready..."
          for i in $(seq 1 24); do
            if docker exec test-mysql mysqladmin ping -h localhost -u root -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "MySQL failed to start"
              docker logs test-mysql
              exit 1
            fi
            sleep 5
          done
          docker run -d --name test-container --network task-test-net -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://test-mysql:3306/taskdb?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true" \
            -e SPRING_DATASOURCE_USERNAME=root \
            -e SPRING_DATASOURCE_PASSWORD=root \
            task-manager-jwt-api:latest
          echo "Waiting for application health..."
          for i in $(seq 1 12); do
            if curl -f http://localhost:8080/actuator/health; then
              echo "Container is healthy"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Container failed to become healthy"
              docker logs test-container
              docker logs test-mysql
              exit 1
            fi
            sleep 10
          done
          docker stop test-container test-mysql
          docker network rm task-test-net

