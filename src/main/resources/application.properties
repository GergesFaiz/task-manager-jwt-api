spring.application.name=task-manager-jwt-api
server.port=8080

# =========================================================
# MySQL (default database)
# Adjust username / password to match your local MySQL.
# createDatabaseIfNotExist=true auto-creates the "taskdb" database.
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# JWT
# app.jwt.secret must be base64-encoded and at least 256 bits (32+ bytes).
# app.jwt.expiration-ms = 24 hours
# =========================================================
app.jwt.secret=+I2JcrCMFHX4lPmA2PJUeuRtE9+R0uWmpuMb0BPH3pQEQsMNSbD1kCYf7EWYdrP1
app.jwt.expiration-ms=86400000